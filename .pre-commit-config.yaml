# Fast pre-commit checks: cpplint (installed by pre-commit) and the system
# cppcheck from the README install step, with the committed CPPLINT.cfg policy,
# scoped to the files this fork authors — the FFT shim and its tests.
#
# clang-tidy is intentionally NOT a pre-commit hook: it takes ~1 min (it parses
# every test TU with all of Eigen / TBB / Imath) and needs a compile database.
# That belongs in CI, not on every commit.
repos:
  - repo: local
    hooks:
      - id: cpplint
        name: cpplint
        entry: cpplint
        # pre-commit installs cpplint in an isolated env, so no system cpplint is
        # needed on PATH. cpplint reads CPPLINT.cfg from the tree.
        language: python
        additional_dependencies: ['cpplint==2.0.2']
        files: '^(include/EncinoWaves/FftwWrapper\.h|test/.*\.cc)$'

      - id: cppcheck
        name: cppcheck
        # The .h parses as C++ only with --language=c++; --error-exitcode makes
        # findings fail the commit (cppcheck otherwise exits 0).
        entry: cppcheck --enable=warning,style,performance,portability --std=c++17 --language=c++ --suppress=missingIncludeSystem --error-exitcode=2 -I include
        language: system
        # The integration tests #include All.h (upstream), and cppcheck follows
        # includes — keep it on the shim-only files so it does not report
        # pre-existing upstream findings.
        files: '^(include/EncinoWaves/FftwWrapper\.h|test/test_FftwWrapper\.cc)$'
