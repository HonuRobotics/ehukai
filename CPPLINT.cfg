# cpplint policy. The library keeps EncinoWaves' upstream house style — Allman
# braces, indented namespaces, and _EncinoWaves_*_h_ include guards — which
# Google's cpplint rejects by category. Filter those rules rather than reformat
# the upstream code; the remaining checks (line length, includes, etc.) still
# apply.
filter=-whitespace/braces,-whitespace/indent_namespace,-build/header_guard,-build/include_order
linelength=80
